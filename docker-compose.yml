services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      # Optional tuning; the defaults in .env.example apply when unset.
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      EXTRACTION_RPS: ${EXTRACTION_RPS:-1.3}
      EXTRACTION_CONCURRENCY: ${EXTRACTION_CONCURRENCY:-16}
      # Auth abuse limits. The defaults are the production values; the end-to-end
      # suite signs up a fresh account per test from a single address, so it runs
      # the stack with these raised (see `make e2e`).
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-10}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      REGISTER_MAX_ATTEMPTS: ${REGISTER_MAX_ATTEMPTS:-5}
      REGISTER_WINDOW_SECONDS: ${REGISTER_WINDOW_SECONDS:-3600}
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
